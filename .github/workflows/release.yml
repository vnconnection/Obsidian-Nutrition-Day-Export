name: Release

on:
  push:
    tags:
      - "0.[0-9]*.[0-9]*"
      - "[1-9]*.[0-9]*.[0-9]*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.ref_name }}

    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Enforce bare semver tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must be bare X.Y.Z: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Run repository checks
        run: |
          pnpm run typecheck
          pnpm run test
          pnpm run lint
          pnpm run build
          node --test release.test.mjs

      - name: Validate release metadata and assets
        run: pnpm run release:validate -- "$RELEASE_TAG"

      - name: Package release assets
        run: pnpm run release:package -- "$RELEASE_TAG" "artifacts/nutrition-day-export-$RELEASE_TAG.zip"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(main.js manifest.json)
          if [[ -f styles.css ]]; then
            assets+=(styles.css)
          fi
          assets+=("artifacts/nutrition-day-export-$RELEASE_TAG.zip")
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md"
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --verify-tag --title "$RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md"
          fi

      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$(cat "docs/releases/$RELEASE_TAG.md")"
          release_json="$(gh release view "$RELEASE_TAG" --json tagName,body,assets)"
          expected_assets=(main.js manifest.json "nutrition-day-export-$RELEASE_TAG.zip")
          if [[ -f styles.css ]]; then
            expected_assets+=(styles.css)
          fi
          expected_json="$(printf '%s\n' "${expected_assets[@]}" | jq -Rsc 'split("\n")[:-1]')"
          jq -e --arg tag "$RELEASE_TAG" --arg body "$notes" --argjson expected "$expected_json" '
            .tagName == $tag and
            .body == $body and
            ([.assets[].name] | sort) == ($expected | sort) and
            ([.assets[] | select(.size <= 0)] | length) == 0
          ' <<<"$release_json" >/dev/null
