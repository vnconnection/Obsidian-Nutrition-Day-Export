name: Release

on:
  push:
    tags:
      - "0.[0-9]*.[0-9]*"
      - "[1-9]*.[0-9]*.[0-9]*"

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.ref_name }}

    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Enforce bare semver tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must be bare X.Y.Z: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Run repository checks
        run: |
          pnpm run typecheck
          pnpm run test
          pnpm run lint
          pnpm run build
          node --test release.test.mjs

      - name: Verify tracked generated bundle
        run: pnpm run release:verify-bundle

      - name: Validate release metadata and assets
        run: pnpm run release:validate -- "$RELEASE_TAG"

      - name: Enforce publishable release impact
        run: pnpm run release:publish-check -- "$RELEASE_TAG"

      - name: Package release assets
        run: pnpm run release:package -- "$RELEASE_TAG" "artifacts/nutrition-day-export-$RELEASE_TAG.zip"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets=(main.js manifest.json)
          if [[ -f styles.css ]]; then
            assets+=(styles.css)
          fi
          assets+=("artifacts/nutrition-day-export-$RELEASE_TAG.zip")
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md" --draft=false --prerelease=false
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --verify-tag --title "$RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md" --draft=false --prerelease=false
          fi

      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          if [[ "$checked_out_sha" != "$GITHUB_SHA" ]]; then
            echo "Checked-out commit does not match the workflow commit: $checked_out_sha != $GITHUB_SHA" >&2
            exit 1
          fi
          remote_tag_sha="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG^{}" | awk 'NR == 1 {print $1}')"
          if [[ -z "$remote_tag_sha" ]]; then
            remote_tag_sha="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" | awk 'NR == 1 {print $1}')"
          fi
          if [[ -z "$remote_tag_sha" || "$remote_tag_sha" != "$checked_out_sha" ]]; then
            echo "Remote tag $RELEASE_TAG does not point to $checked_out_sha: $remote_tag_sha" >&2
            exit 1
          fi
          release_json="$(gh release view "$RELEASE_TAG" --json tagName,isDraft,isPrerelease,publishedAt,body,assets)"
          expected_assets=(main.js manifest.json "nutrition-day-export-$RELEASE_TAG.zip")
          if [[ -f styles.css ]]; then
            expected_assets+=(styles.css)
          fi
          expected_json="$(printf '%s\n' "${expected_assets[@]}" | jq -Rsc 'split("\n")[:-1]')"
          for asset in "${expected_assets[@]}"; do
            local_path="$asset"
            if [[ "$asset" == nutrition-day-export-*.zip ]]; then
              local_path="artifacts/$asset"
            fi
            if [[ ! -s "$local_path" ]]; then
              echo "Expected local asset is missing or empty: $asset" >&2
              exit 1
            fi
          done
          checksum_args=()
          for asset in "${expected_assets[@]}"; do
            local_path="$asset"
            if [[ "$asset" == nutrition-day-export-*.zip ]]; then
              local_path="artifacts/$asset"
            fi
            checksum_args+=("$(sha256sum "$local_path" | awk '{print $1}'):$asset")
          done
          expected_digests="$(printf '%s\n' "${checksum_args[@]}" | jq -Rsc 'split("\n")[:-1] | map(split(":")) | map({name: .[1], digest: ("sha256:" + .[0])})')"
          jq -e --arg tag "$RELEASE_TAG" --rawfile body "docs/releases/$RELEASE_TAG.md" --argjson expected "$expected_json" '
            .tagName == $tag and
            .isDraft == false and
            .isPrerelease == false and
            (.publishedAt | type == "string" and length > 0) and
            .body == $body and
            ([.assets[].name] | sort) == ($expected | sort) and
            ([.assets[] | select((.size | type != "number") or .size <= 0 or (.digest | type != "string") or (.digest | startswith("sha256:") | not))] | length) == 0
          ' <<<"$release_json" >/dev/null
          jq -e --argjson expected "$expected_digests" '
            ([.assets[] | {name, digest}] | sort_by(.name)) == ($expected | sort_by(.name))
          ' <<<"$release_json" >/dev/null

      - name: Verify final remote tag ref
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          final_remote_tag_sha="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG^{}" | awk 'NR == 1 {print $1}')"
          if [[ -z "$final_remote_tag_sha" ]]; then
            final_remote_tag_sha="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" | awk 'NR == 1 {print $1}')"
          fi
          if [[ -z "$final_remote_tag_sha" || "$final_remote_tag_sha" != "$checked_out_sha" ]]; then
            echo "Final remote tag $RELEASE_TAG does not point to $checked_out_sha: $final_remote_tag_sha" >&2
            exit 1
          fi
